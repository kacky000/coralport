<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coralport</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0c12; font-family: 'Segoe UI', Arial, sans-serif; }
#game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui-layer { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#ui-layer * { pointer-events: auto; }
#loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0c12; z-index: 100; color: #fff; font-size: 18px; }
#loading .bar { width: 300px; height: 4px; background: #222; margin-top: 20px; border-radius: 2px; }
#loading .fill { height: 100%; background: linear-gradient(90deg, #f7a825, #e85d3a); border-radius: 2px; width: 0%; transition: width 0.3s; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="ui-layer"></div>
<div id="loading">
  <div style="font-size:36px;font-weight:bold;letter-spacing:4px;color:#f7a825;">CORALPORT</div>
  <div style="margin-top:8px;color:#888;font-size:14px;">Loading...</div>
  <div class="bar"><div class="fill" id="load-bar"></div></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
